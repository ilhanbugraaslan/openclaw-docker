name: CI Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve latest openclaw release tag
        id: openclaw-release
        run: |
          VERSION=$(curl -s https://api.github.com/repos/openclaw/openclaw/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "Building against openclaw v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          push: false
          build-args: |
            OPENCLAW_GIT_REF=v${{ steps.openclaw-release.outputs.version }}
          tags: openclaw-base:ci

      - name: Build final image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          build-args: |
            BASE_IMAGE=openclaw-base:ci
          tags: openclaw:ci
